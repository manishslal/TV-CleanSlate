<html lang="en">
<head>

<style>
@font-face { font-family: Board; src: url(barlow_condensed_semibold.ttf); }
:root { --u: calc(100vw / 1920); --ink: #efe7d2; --label: #fff; --dim: rgba(235,235,245,.6); --glass: rgba(24,24,26,.82); --hair: rgba(255,255,255,.1);
  --panel: rgba(32,32,34,.96); --row: rgba(120,120,128,.18); --focus: #f5f5f7; --onfocus: #1d1d1f; --sheet-a: rgba(30,33,40,.44); --sheet-b: rgba(20,22,28,.56); --plain-a: rgba(46,50,58,.9); --plain-b: rgba(24,26,32,.94);
  --dock-a: rgba(255,255,255,.14); --dock-b: rgba(255,255,255,.05); --rim: rgba(255,255,255,.4); --ring: #f5f5f7; --ringgap: rgba(0,0,0,.75);
  --onwall: #fff; --onwall-shadow: rgba(0,0,0,.75); --onsheet: #fff; --onsheet-shadow: rgba(0,0,0,.75); --lift: rgba(0,0,0,.6); --dockshadow: rgba(0,0,0,.42); --cleartile: var(--glass); --glowalpha: .5; }

  --focus: #1d1d1f; --onfocus: #fff; --sheet-a: rgba(238,240,244,.52); --sheet-b: rgba(222,226,232,.62); --plain-a: rgba(236,238,242,.92); --plain-b: rgba(214,218,226,.94); --dock-a: rgba(255,255,255,.34); --dock-b: rgba(255,255,255,.18); --rim: rgba(255,255,255,.9); --ringgap: rgba(0,0,0,.4);
  --onsheet: #1d1d1f; --onsheet-shadow: rgba(255,255,255,.7); --lift: rgba(0,0,0,.3); --dockshadow: rgba(0,0,0,.22); --cleartile: rgba(44,44,48,.88); --glowalpha: .3; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: var(--label); font-family: "LG Smart UI", "Helvetica Neue", Arial, sans-serif; cursor: none; }
.fill { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
#wall { background: radial-gradient(120% 90% at 30% 10%, #1c2a3a, #05070b 70%); }

#shade { transition: opacity .8s; background-image: radial-gradient(62% 58% at 0 0, rgba(0,0,0,.62), rgba(0,0,0,0) 72%), linear-gradient(180deg, rgba(0,0,0,.3) 0, rgba(0,0,0,.04) 40%, rgba(0,0,0,.34) 100%); }
body.right #shade { background-image: radial-gradient(62% 58% at 100% 0, rgba(0,0,0,.62), rgba(0,0,0,0) 72%), linear-gradient(180deg, rgba(0,0,0,.3) 0, rgba(0,0,0,.04) 40%, rgba(0,0,0,.34) 100%); }

/* This TV's video plane can't be blurred, so softly blurred frames baked from the clip play over it in step: inside the dock at rest, over the whole screen further down */

  clip-path: inset(calc(800 * var(--u)) calc(52 * var(--u)) calc(40 * var(--u)) calc(52 * var(--u)) round calc(36 * var(--u))); }

.fl.on { opacity: 1; }
#sheet { opacity: 0; transition: opacity .2s; background: linear-gradient(180deg, var(--plain-a), var(--plain-b)); }
body.frosted #sheet { background: linear-gradient(180deg, var(--sheet-a), var(--sheet-b)); }
#dock { position: fixed; left: calc(52 * var(--u)); right: calc(52 * var(--u)); bottom: calc(40 * var(--u)); height: calc(240 * var(--u)); border-radius: calc(36 * var(--u)); transition: opacity .2s;
  background: linear-gradient(180deg, var(--dock-a), var(--dock-b)); box-shadow: inset 0 1px 0 var(--rim), inset 0 -1px 0 rgba(255,255,255,.08), 0 calc(18 * var(--u)) calc(48 * var(--u)) var(--dockshadow); }

#top { position: fixed; left: calc(90 * var(--u)); top: calc(70 * var(--u)); transform-origin: 0 0; transition: transform .22s ease-out, opacity .4s; }

#clock > * { margin-right: calc(12 * var(--u)); }
#meridiem .card + .card { margin-left: calc(6 * var(--u)); }
#clock > #meridiem { display: flex; margin-left: calc(4 * var(--u)); }
.card { --h: calc(128 * var(--u)); --r: calc(9 * var(--u)); position: relative; width: calc(88 * var(--u)); height: var(--h); text-align: center; border-radius: var(--r); background: #000;
  box-shadow: 0 calc(8 * var(--u)) calc(22 * var(--u)) rgba(0,0,0,.55); font-size: calc(116 * var(--u)); line-height: var(--h); perspective: calc(640 * var(--u)); }

.card::before, .card::after { content: ''; position: absolute; top: 50%; width: calc(5 * var(--u)); height: calc(14 * var(--u)); margin-top: calc(-7 * var(--u)); border-radius: calc(2 * var(--u)); background: #4a4a50; z-index: 4; }
.card::before { left: 0; }

/* a split-flap: two still halves, and two moving flaps while the card turns */
.half { position: absolute; left: 0; right: 0; height: calc(var(--h) / 2 - 1px); overflow: hidden; backface-visibility: hidden; }
.half span { position: absolute; left: 0; right: 0; height: var(--h); }
.half.top { top: 0; border-radius: var(--r) var(--r) 0 0; background: linear-gradient(#313137, #27272b); }
.half.bot { bottom: 0; border-radius: 0 0 var(--r) var(--r); background: linear-gradient(#212125, #1a1a1e); }
.half.bot span { bottom: 0; }
.ft { z-index: 2; transform-origin: 50% calc(100% + 1px); animation: fall linear both; animation-timing-function: cubic-bezier(.55,.06,.9,.5); }
.fb { z-index: 3; transform-origin: 50% -1px; animation: land both; }
.ft::after, .fb::after { content: ''; position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: #000; }
.ft::after { animation: dusk both; animation-duration: inherit; animation-timing-function: ease-in; }
.fb::after { animation: dawn both; animation-duration: inherit; animation-delay: inherit; }
@keyframes fall { from { transform: rotateX(0); } to { transform: rotateX(-90deg); } }
@keyframes land { 0% { transform: rotateX(90deg); animation-timing-function: cubic-bezier(.3,.6,.7,1); } 66% { transform: rotateX(0); animation-timing-function: ease-out; } 82% { transform: rotateX(14deg); animation-timing-function: ease-in; } 100% { transform: rotateX(0); } }
@keyframes dusk { from { opacity: 0; } to { opacity: .55; } }
@keyframes dawn { from { opacity: .55; } to { opacity: 0; } }
#clock.flip .card, #clock.plain .card { background: none; box-shadow: none; width: calc(62 * var(--u)); text-shadow: 0 calc(2 * var(--u)) calc(18 * var(--u)) rgba(0,0,0,.6); }
#clock.flip .card.sm, #clock.plain .card.sm { width: calc(28 * var(--u)); }
#clock.flip .card::before, #clock.flip .card::after, #clock.plain .card::before, #clock.plain .card::after { display: none; }
#clock.flip .half, #clock.plain .half { background: none; }
#clock.flip .ft::after, #clock.flip .fb::after { display: none; }
body.light.down .colon { color: var(--onsheet); }
.colon { font-size: calc(92 * var(--u)); line-height: calc(118 * var(--u)); }
#line { margin-top: calc(26 * var(--u)); font-family: Board, sans-serif; letter-spacing: .05em; color: var(--ink); font-size: calc(34 * var(--u)); text-transform: uppercase; text-shadow: 0 calc(2 * var(--u)) calc(18 * var(--u)) rgba(0,0,0,.7); }
#line span { opacity: .78; }
#line svg { width: calc(30 * var(--u)); height: calc(30 * var(--u)); vertical-align: calc(-5 * var(--u)); margin: 0 calc(6 * var(--u)); fill: currentColor; }

#pill { position: fixed; right: calc(90 * var(--u)); top: calc(66 * var(--u)); height: calc(52 * var(--u)); padding: 0 calc(20 * var(--u)); border-radius: calc(26 * var(--u)); background: var(--glass);
  display: flex; align-items: center; font-size: calc(22 * var(--u)); box-shadow: inset 0 0 0 1px var(--hair); transition: opacity .8s, transform .1s ease-out; }
body.right #pill { right: auto; left: calc(90 * var(--u)); }
#pill svg { width: calc(26 * var(--u)); height: calc(26 * var(--u)); fill: currentColor; margin-right: calc(10 * var(--u)); }
#pill span + svg { margin-left: calc(12 * var(--u)); margin-right: 0; }
#pill.f { background: var(--focus); color: var(--onfocus); transform: scale(1.1); }

#gridwrap { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; transition: opacity .8s; }
#grid { display: grid; grid-template-columns: repeat(6, calc(252 * var(--u))); grid-auto-rows: calc(186 * var(--u)); column-gap: calc(46 * var(--u)); row-gap: calc(14 * var(--u)); padding: 0 calc(89 * var(--u)); transition: transform .22s ease-out; }
body:not(.down) #grid .tile:nth-child(n+7) { visibility: hidden; }
.tile { position: relative; }
.plate { position: relative; width: calc(252 * var(--u)); height: calc(142 * var(--u)); border-radius: calc(22 * var(--u)); background: var(--glass); display: flex; align-items: center; justify-content: center; overflow: hidden; transition: transform .1s ease-out; }
body.first .plate { animation: rise .42s ease-out backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(calc(26 * var(--u))) scale(.94); } }
.plate::after { content: ''; position: absolute; left: 0; right: 0; top: 0; bottom: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--hair), inset 0 1px 0 rgba(255,255,255,.22); background: linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,0) 42%); }
.plate img, .plate canvas { position: absolute; }
.plate.clear { background: var(--cleartile); }
/* Dark Glass is the tile's own look, whatever the appearance */
body.glasstiles .plate { background: rgba(24,24,26,.82); color: #fff; }
body.glasstiles .plate b, body.light.glasstiles .plate b { color: var(--ink); }
body.light.glasstiles .plate.input img { filter: brightness(3); }
.plate.mark img { position: static; }
.plate.plainicon img { position: static; height: 66%; }
.plate.input img { position: static; height: 52%; margin-right: calc(14 * var(--u)); filter: brightness(3); }
body.light .plate.input img { filter: none; }
.plate b { font-family: Board, sans-serif; font-weight: normal; font-size: calc(40 * var(--u)); letter-spacing: .03em; color: var(--ink); }
body.light .plate b { color: #1d1d1f; }
.plate svg { width: calc(88 * var(--u)); height: calc(88 * var(--u)); fill: currentColor; }
.minis { display: grid; grid-template-columns: repeat(2, calc(84 * var(--u))); grid-auto-rows: calc(58 * var(--u)); column-gap: calc(6 * var(--u)); row-gap: calc(4 * var(--u)); }
.minis img { position: static; width: calc(84 * var(--u)); height: calc(58 * var(--u)); object-fit: contain; }
.name { margin-top: calc(18 * var(--u)); text-align: center; font-size: calc(21 * var(--u)); opacity: 0; color: var(--onwall); text-shadow: 0 1px calc(8 * var(--u)) var(--onwall-shadow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.names .name, .tile.f .name { opacity: 1; }
body.down #grid .name { color: var(--onsheet); text-shadow: 0 1px calc(6 * var(--u)) var(--onsheet-shadow); }
.tile.f { z-index: 2; }
.tile.f .plate { transform: scale(1.15); box-shadow: 0 0 0 calc(3 * var(--u)) var(--ringgap), 0 0 0 calc(6 * var(--u)) var(--ring), 0 calc(18 * var(--u)) calc(30 * var(--u)) var(--lift); }
.tile.move .plate { transform: scale(1.18); box-shadow: 0 0 0 calc(3 * var(--u)) rgba(0,0,0,.75), 0 0 0 calc(7 * var(--u)) #ffd60a, 0 calc(18 * var(--u)) calc(30 * var(--u)) var(--lift); }
.tile.push .plate { animation: push .18s ease-out; }
@keyframes push { 40% { transform: scale(1.15) translateX(var(--dx, 0)) translateY(var(--dy, 0)); } }
body.lite .tile.f .plate { box-shadow: 0 0 0 calc(3 * var(--u)) var(--ringgap), 0 0 0 calc(6 * var(--u)) var(--ring); }
body.lite #glow { display: none; }

/* panels */
#scrim { background: rgba(0,0,0,.5); opacity: 0; visibility: hidden; transition: opacity .14s; z-index: 9; }
body.modal #scrim { opacity: 1; visibility: visible; }
.panel { position: fixed; top: calc(70 * var(--u)); bottom: calc(70 * var(--u)); right: calc(70 * var(--u)); width: calc(640 * var(--u)); border-radius: calc(32 * var(--u)); background: var(--panel); box-shadow: 0 calc(20 * var(--u)) calc(60 * var(--u)) rgba(0,0,0,.5), inset 0 1px 0 var(--rim); padding: calc(34 * var(--u)); overflow: hidden; z-index: 10; display: none; }
.panel.on { display: block; animation: pop .18s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateX(calc(40 * var(--u))); } }
.panel h2 { font-size: calc(36 * var(--u)); font-weight: 600; margin-bottom: calc(6 * var(--u)); }
.panel .sub { color: var(--dim); font-size: calc(21 * var(--u)); margin-bottom: calc(22 * var(--u)); line-height: 1.4; }
.rows { transition: transform .14s ease-out; }
.row { display: flex; align-items: center; min-height: calc(68 * var(--u)); padding: calc(12 * var(--u)) calc(20 * var(--u)); margin-bottom: calc(8 * var(--u)); border-radius: calc(16 * var(--u)); background: var(--row); font-size: calc(25 * var(--u)); }
.row svg { width: calc(32 * var(--u)); height: calc(32 * var(--u)); fill: currentColor; margin-right: calc(16 * var(--u)); flex: none; }
.row .l { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .v { color: var(--dim); margin-left: calc(14 * var(--u)); font-size: calc(23 * var(--u)); white-space: nowrap; }
.row .bar { width: calc(190 * var(--u)); height: calc(10 * var(--u)); border-radius: calc(5 * var(--u)); background: var(--hair); overflow: hidden; margin-left: calc(14 * var(--u)); }
.row .bar i { display: block; height: 100%; background: currentColor; }
.row.f { background: var(--focus); color: var(--onfocus); }
.row.f .v { color: inherit; opacity: .72; }
.row.note { background: none; color: var(--dim); font-size: calc(21 * var(--u)); min-height: 0; line-height: 1.4; }
.row input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: inherit; font: inherit; }
#fgrid { display: grid; grid-template-columns: repeat(5, calc(252 * var(--u))); grid-auto-rows: calc(186 * var(--u)); column-gap: calc(46 * var(--u)); row-gap: calc(14 * var(--u)); justify-content: center; align-content: center; }
#folder { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 10; display: none; padding-top: calc(120 * var(--u)); }
#folder.on { display: block; }
#folder h2 { text-align: center; font-size: calc(40 * var(--u)); font-weight: 600; margin-bottom: calc(40 * var(--u)); color: #fff; }
#pin { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 12; display: none; align-items: center; justify-content: center; flex-direction: column; color: #fff; background: rgba(0,0,0,.72); }
#pin.on { display: flex; }
#pin p { font-size: calc(30 * var(--u)); margin-bottom: calc(28 * var(--u)); }
#pin .dots { font-size: calc(46 * var(--u)); letter-spacing: .3em; margin-bottom: calc(28 * var(--u)); height: calc(60 * var(--u)); }
#pin .keys { display: flex; }
#pin .keys b { width: calc(70 * var(--u)); height: calc(84 * var(--u)); line-height: calc(84 * var(--u)); margin: 0 calc(5 * var(--u)); text-align: center; font-size: calc(36 * var(--u)); font-weight: 500; border-radius: calc(14 * var(--u)); background: rgba(255,255,255,.14); }
#pin .keys b.f { background: #f5f5f7; color: #1d1d1f; }

/* screensaver */
#caption, #news { position: fixed; bottom: calc(64 * var(--u)); opacity: 0; transition: opacity .8s; color: #fff; text-shadow: 0 calc(2 * var(--u)) calc(14 * var(--u)) rgba(0,0,0,.8); }
#caption { left: calc(90 * var(--u)); font-size: calc(30 * var(--u)); }
#news { right: calc(90 * var(--u)); max-width: calc(760 * var(--u)); text-align: right; font-size: calc(30 * var(--u)); line-height: 1.32; }
#news small { display: block; font-size: calc(19 * var(--u)); letter-spacing: .08em; text-transform: uppercase; opacity: .72; margin-bottom: calc(6 * var(--u)); }
body.idle #gridwrap, body.idle #pill, body.idle #dock, body.idle #hint, body.idle #sheet, body.idle #glow, body.idle #fclip { opacity: 0; }
body.idle #shade { opacity: .5; }
body.idle #caption, body.idle.news #news { opacity: 1; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<body class="first">
<div id="wall" class="fill"></div>
<video id="v0" muted playsinline></video>
<video id="v1" muted playsinline></video>
<img id="photo" alt="">
<div id="glow"></div>
<div id="shade" class="fill"></div>
<div id="fclip"><div class="fl" id="f0"></div><div class="fl" id="f1"></div></div>
<div id="sheet" class="fill"></div>
<div id="dock"></div>
<div id="hint">Down for all apps</div>
<div id="top"><div id="clock"></div><div id="line"></div></div>
<div id="pill"></div>
<div id="gridwrap"><div id="grid"></div></div>
<div id="caption"></div>
<div id="news"></div>
<div id="scrim" class="fill"></div>

<script>
/* Home for webOS: a web version of the io.manish.home home screen, served by CleanYourTV's Home takeover. */
var API = 'http://127.0.0.1:8765', SVC = 'http://127.0.0.1:8766';
var VERSION = '99.0.0';
var COLS = 6, PITCH = 200;
var ORDER = ['netflix', 'youtube.leanback.v4', 'amazon', 'com.disney.disneyplus-prod', 'com.wbd.stream', 'hulu', 'com.apple.appletv',
  'cdp-30', 'com.peacock.tv', 'com.cbs-all-access.webapp.prod', 'spotify-beehive'];
var HIDDEN = ['amazon.alexa.view', 'com.webos.app.homeconnect', 'com.webos.app.lgchannels', 'com.webos.app.livepick-full', 'com.webos.app.roomconnect', 'com.webos.app.sportsteamsettings'];
var VIDEOS = __VIDEOS__;
var ICONS = __ICONS__;
var TOPICS = __TOPICS__;
var LOGOS = __LOGOS__;
var FROST = __FROST__;

var $ = function (id) { return document.getElementById(id); };
function read(key, d) { try { return JSON.parse(localStorage.getItem(key)) || d; } catch (e) { return d; } }
function write(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
function svg(name) { return '<svg viewBox="0 -960 960 960"><path d="' + (ICONS[name] || '') + '"/></svg>'; }
function api(path, body) { return fetch(API + path, body ? { method: 'POST', body: JSON.stringify(body) } : {}).then(function (r) { return r.json(); }); }
function svc(path) { return fetch(SVC + path).then(function (r) { return r.json(); }); }
function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

/* ---- settings, the same names as Android Home's Personalize ---- */
var S = Object.assign({ clockStyle: 'cards', clockRight: false, largeClock: false, h24: false, showWeather: true, fahrenheit: true, flapSound: false, uiSounds: true,
  appearance: 'dark', tiles: 'full', effects: 'auto', showAllNames: false, cats: ['landscapes', 'cities'], source: 'aerial', saverMin: 5, saverClock: true, backSaver: true,
  headlines: true, topics: ['tech'], newsShuffle: false, place: 'New York', lat: 40.7128, lon: -74.0060, hidden: HIDDEN.slice(), folders: {}, order: null, pin: '', bootTarget: '' }, read('home-settings', {}));
var legacy = read('home-order', null);
if (!S.order && legacy) S.order = legacy;
function save() { write('home-settings', S); }
var colors = read('home-colors', {});

var tiles = [], focus = 0, row = 0, active = 0, lastKey = Date.now(), moving = false, held = null, zone = 'grid', allApps = [], allInputs = [], wx = null;

/* ---- theme ---- */
var lastGlass = null;
function darkNow() {
  if (S.appearance === 'dark') return true;
  if (S.appearance === 'light') return false;
  if (wx && wx.rise && wx.set) { var n = Date.now(); return n < wx.rise || n > wx.set; }
  var h = new Date().getHours();
  return h < 7 || h >= 19;
}
function theme() {
  var c = document.body.classList;
  c.toggle('light', !darkNow());
  c.toggle('right', S.clockRight);
  c.toggle('big', S.largeClock);
  c.toggle('names', S.showAllNames);
  c.toggle('lite', S.effects === 'lite');
  var glass = tileGlass();
  c.toggle('glasstiles', glass);
  c.toggle('dimwall', glass && darkNow());
  if (glass !== lastGlass) { lastGlass = glass; if (allApps.length) build(); }
  $('clock').className = S.clockStyle;
}

/* ---- sound ---- */
var ac = null, sounds = {};
function sound(name, force) {

  g.insertBefore(t.el, g.children[to] || null);

  sound('move');
}

/* ---- panels: a stack of pages, each a list of rows ---- */
var stack = [], pageAt = 0;
function modal() { document.body.classList.toggle('modal', stack.length > 0 || !!folderOpen || pinCb !== null); }
function push(page) { stack.push(page); pageAt = 0; drawPage(); modal(); }
function pop() {
  sound('back');
  stack.pop();
  pageAt = 0;
  if (stack.length) drawPage(); else $('panel').className = 'panel';
  modal();
}
function closeAll() { stack = []; $('panel').className = 'panel'; modal(); }
function rowsOf(p) { return typeof p.rows === 'function' ? p.rows() : p.rows; }
function drawPage(keep) {
  var p = stack[stack.length - 1], rows = rowsOf(p), el = $('panel'), h = '<h2>' + esc(p.title) + '</h2>' + (p.sub ? '<div class="sub">' + esc(p.sub) + '</div>' : '') + '<div class="rows" id="rows">';
  if (!keep) { pageAt = 0; while (rows[pageAt] && rows[pageAt].note) pageAt++; }
  rows.forEach(function (r, i) {
    var v = r.value ? (typeof r.value === 'function' ? r.value() : r.value) : '';
    h += '<div class="row' + (r.note ? ' note' : '') + (i === pageAt ? ' f' : '') + '">' + (r.icon ? svg(r.icon) : '') + (r.input ? '<input id="field" placeholder="' + esc(r.input) + '">' : '<span class="l">' + esc(r.label) + '</span>') +
      (r.bar !== undefined ? '<span class="bar"><i style="width:' + (typeof r.bar === 'function' ? r.bar() : r.bar) + '%"></i></span>' : '') + (v !== '' ? '<span class="v">' + esc(v) + '</span>' : '') + (r.to ? svg('CHEVRON_RIGHT') : '') + '</div>';
  });
  el.innerHTML = h + '</div>';
  el.className = 'panel on';
  el.style.animation = keep ? 'none' : '';
  var box = $('rows'), f = box.children[pageAt];
  if (f) { var limit = el.clientHeight - box.offsetTop - 30, y = f.offsetTop + f.offsetHeight - box.offsetTop; box.style.transform = 'translateY(' + Math.min(0, limit - y) + 'px)'; }
}
function pageKey(k) {
  var p = stack[stack.length - 1], rows = rowsOf(p), r = rows[pageAt], n = pageAt;
  if (k === 461 || k === 8) return pop();
  if (k === 38 || k === 40) {
    do { n += k === 40 ? 1 : -1; } while (rows[n] && rows[n].note);
    if (rows[n]) { pageAt = n; sound('move'); drawPage(true); } else sound('limit');
    return;
  }
  if (!r) return;
  if ((k === 37 || k === 39) && r.step) { r.step(k === 39 ? 1 : -1); sound('move'); drawPage(true); return; }
  if (k === 37 && !r.step) return pop();
  if (k === 13) {
    sound('select');
    if (r.input) { $('field').focus(); return; }
    if (r.step && !r.ok) { r.step(1); drawPage(true); return; }
    if (r.to) return guard(r.to);
    if (r.ok) { r.ok(); if (stack.length) drawPage(true); }
  }
}
function choice(label, list, get, set, icon) {
  return { label: label, icon: icon, value: function () { var c = list.filter(function (x) { return x[0] === get(); })[0]; return c ? c[1] : ''; },
    step: function (d) { var i = list.map(function (x) { return x[0]; }).indexOf(get()); set(list[(i + d + list.length) % list.length][0]); save(); theme(); clock(true); line(); } };
}
function toggle(label, key, after, icon) { return choice(label, [[true, 'On'], [false, 'Off']], function () { return S[key]; }, function (v) { S[key] = v; if (after) after(); }, icon); }
function guard(page) { typeof page === 'function' ? push(page()) : push(page); }

function pagePersonalize() {
  return { title: 'Personalize', rows: [
    { label: 'Clock', icon: 'CALENDAR_MONTH', to: { title: 'Clock', rows: function () { return [
      choice('Clock Style', [['cards', 'Cards'], ['flip', 'Flip'], ['plain', 'Plain']], function () { return S.clockStyle; }, function (v) { S.clockStyle = v; }),
      choice('Position', [[false, 'Left'], [true, 'Right']], function () { return S.clockRight; }, function (v) { S.clockRight = v; }),
      toggle('Large Clock', 'largeClock'),
      choice('Format', [[false, '5:39 PM'], [true, '17:39']], function () { return S.h24; }, function (v) { S.h24 = v; }),
      toggle('Flap Sound', 'flapSound') ]; } } },
    { label: 'Appearance', icon: 'LIGHT_MODE', to: { title: 'Appearance', rows: function () { return [
      choice('Appearance', [['dark', 'Dark'], ['light', 'Light'], ['auto', 'Auto']], function () { return S.appearance; }, function (v) { S.appearance = v; }),
      choice('App Tiles', [['full', 'Full Color'], ['dark', 'Dark Glass']], function () { return S.tiles; }, function (v) { S.tiles = v; build(); }),
      choice('Effects', [['auto', 'Full'], ['lite', 'Lite']], function () { return S.effects; }, function (v) { S.effects = v; }),

}
function pageWall() {
  var cats = [['landscapes', 'Landscapes'], ['cities', 'Cities'], ['space', 'Space'], ['underwater', 'Underwater']];
  return { title: 'Wallpaper', rows: function () {
    var rows = [choice('Source', [['aerial', 'Aerial Videos'], ['plexv', 'My Videos (Plex)'], ['plexp', 'My Photos (Plex)']], function () { return S.source; }, function (v) { S.source = v; restartWall(); })];
    cats.forEach(function (c) {

        var i = S.cats.indexOf(c[0]);

        save(); queue = []; } });
    });

  } };
}
function pageWeather() {
  var found = [], rowsFn = function () {
    var rows = [toggle('Show Weather', 'showWeather', line), choice('Units', [[true, '°F'], [false, '°C']], function () { return S.fahrenheit; }, function (v) { S.fahrenheit = v; line(); }),
      { label: 'Location: ' + S.place, note: true }, { input: 'Search for a city', icon: 'LANGUAGE' }];

    fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=en&name=' + encodeURIComponent(q)).then(function (r) { return r.json(); }).then(function (j) { found = j.results || []; pageAt = found.length ? 4 : 3; drawPage(true); }).catch(function () {});
  } };
}
function pageSaver() {
  return { title: 'Screensaver', rows: function () { return [
    choice('Start After', [[2, '2 Minutes'], [5, '5 Minutes'], [10, '10 Minutes'], [20, '20 Minutes'], [0, 'Never']], function () { return S.saverMin; }, function (v) { S.saverMin = v; }),
    toggle('Show Clock', 'saverClock'), toggle('Back Starts Screensaver', 'backSaver'), { label: 'Start Now', ok: function () { closeAll(); saver(true); } } ]; } };
}

    TOPICS.forEach(function (t) {

        var i = S.topics.indexOf(t[0]);
        if (i >= 0) S.topics.splice(i, 1); else S.topics.push(t[0]);
        save(); loadNews(); } });
    });

  } };
}
function pageHidden() {
  return { title: 'Hidden Apps', sub: 'Press OK to show an app on Home again.', rows: function () {
    var rows = allApps.concat(allInputs).filter(function (a) { return S.hidden.indexOf(a.id) >= 0; }).map(function (a) {
      return { label: a.title, ok: function () { S.hidden.splice(S.hidden.indexOf(a.id), 1); save(); build(); } };
    });

  } };
}
function pagePin() {
  return { title: 'Passcode', sub: 'Asks for four digits before Personalize and Hidden Apps.', rows: function () {
    return S.pin ? [{ label: 'Turn Passcode Off', ok: function () { S.pin = ''; save(); } }] : [{ label: 'Set Passcode', ok: function () { askPin('Choose four digits', function (p) { S.pin = p; save(); drawPage(true); }); } }];
  } };
}
function pageInputs() {
  return { title: 'Inputs', rows: function () {
    var rows = allInputs.map(function (x) { return { label: x.title, icon: 'HDMI', ok: function () { closeAll(); open(x); } }; });
    return rows.length ? rows : [{ label: 'No inputs found on this TV', note: true }];

}
function pageBoot() {
  return { title: 'When TV Turns On', sub: 'What opens each time the TV turns on.', rows: function () {
    return [{ id: '', title: 'Home' }].concat(allInputs, allApps.filter(function (a) { return ORDER.indexOf(a.id) >= 0; })).map(function (x) {
      return { label: x.title, value: function () { return S.bootTarget === x.id ? 'On' : ''; }, ok: function () { S.bootTarget = x.id; save(); svc('/target?id=' + encodeURIComponent(x.id)).catch(function () {}); } };
    });

}
var volume = { v: 0, muted: false };
function setVol(d) { svc('/vol?step=' + d).then(function (j) { if (j.volumeStatus) { volume.v = j.volumeStatus.volume; volume.muted = j.volumeStatus.muteStatus; } if (stack.length) drawPage(true); }).catch(function () {}); }
function pageControl() {
  var n = new Date(), when = n.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: !S.h24 }) + '  ·  ' + n.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  setVol(0);
  return { title: 'Control Center', sub: when, rows: function () {
    var w = net && net.wired && net.wired.state === 'connected' ? net.wired : net && net.wifi;
    return [
      { label: 'Volume', icon: volume.muted ? 'VOLUME_OFF' : 'VOLUME_UP', bar: function () { return volume.muted ? 0 : volume.v; }, value: function () { return volume.muted ? 'Muted' : String(volume.v); }, step: function (d) { setVol(d); }, ok: function () { setVol('mute'); } },
      { label: 'Brightness', icon: 'LIGHT_MODE', value: 'Picture Settings', ok: function () { closeAll(); open({ id: 'com.palm.app.settings' }); } },
      { label: 'Inputs', icon: 'INPUT', to: pageInputs },
      { label: 'Network', icon: net && net.wired && net.wired.state === 'connected' ? 'LAN' : 'WIFI', value: (w && w.ipAddress) || 'Offline', ok: function () { closeAll(); open({ id: 'com.palm.app.settings' }); } },
      { label: 'Settings', icon: 'SETTINGS', ok: function () { closeAll(); open({ id: 'com.palm.app.settings' }); } },
      { label: 'Personalize', icon: 'IMAGE', ok: function () { lock(function () { push(pagePersonalize()); }); } },
      { label: 'When TV Turns On', icon: 'POWER', value: function () { var t = allInputs.concat(allApps).filter(function (x) { return x.id === S.bootTarget; })[0]; return t ? t.title : 'Home'; }, to: pageBoot },
      { label: 'Turn Off TV', icon: 'POWER', ok: function () { api('/api/power/off', {}).catch(function () {}); } } ];
  } };
}
function tileMenu(t) {
  var rows = [{ label: 'Move', icon: 'OPEN_WITH', ok: function () { closeAll(); setMoving(true); } }, { label: 'Hide', icon: 'VISIBILITY_OFF', ok: function () { closeAll(); S.hidden.push(t.id); save(); build(); } }];
  if (t.folder) rows = [rows[0], { label: 'Delete Folder', icon: 'DELETE', ok: function () { closeAll(); delete S.folders[t.id]; save(); build(); } }];
  else if (t.icon) {
    Object.keys(S.folders).forEach(function (k) { rows.push({ label: 'Add to ' + S.folders[k].name, icon: 'FOLDER', ok: function () { closeAll(); S.folders[k].items.push(t.id); save(); build(); } }); });
    rows.push({ label: 'New Folder', icon: 'FOLDER', ok: function () { closeAll(); var k = 'folder:' + Date.now(); S.folders[k] = { name: 'Folder ' + (Object.keys(S.folders).length + 1), items: [t.id] }; S.order = tiles.map(function (x) { return x.id; }); S.order.splice(focus, 0, k); save(); build(); } });
    var armed = false;

  }
  return { title: t.title, rows: rows };
}

/* ---- passcode ---- */
var pinCb = null, pinVal = '', pinAt = 0;
function drawPin() {
  $('pindots').textContent = '●'.repeat(pinVal.length) + '○'.repeat(4 - pinVal.length);
  var h = '';
  for (var i = 0; i < 10; i++) h += '<b' + (i === pinAt ? ' class="f"' : '') + '>' + i + '</b>';
  $('pinkeys').innerHTML = h;
}
function askPin(title, cb) { pinCb = cb; pinVal = ''; $('pintitle').textContent = title; $('pin').className = 'on'; drawPin(); modal(); }
function pinDone() { $('pin').className = ''; pinCb = null; modal(); }
function pinKey(k) {
  if (k === 461 || k === 8) return pinDone();
  if (k === 37) pinAt = (pinAt + 9) % 10;
  else if (k === 39) pinAt = (pinAt + 1) % 10;
  else if (k === 13 || (k >= 48 && k <= 57)) {
    pinVal += k === 13 ? pinAt : k - 48;
    if (pinVal.length === 4) { var v = pinVal, cb = pinCb; pinDone(); return cb(v); }
  }
  drawPin();
}
function lock(then) {
  if (!S.pin) return then();
  askPin('Enter your passcode', function (p) { if (p === S.pin) then(); else sound('limit'); });
}

/* ---- folders ---- */
var folderOpen = null, folderAt = 0;
function drawFolder() {
  var g = $('fgrid');
  folderOpen.items.forEach(function (t, i) { t.el.className = 'tile' + (i === folderAt ? ' f' : ''); });
  if (!g.children.length) folderOpen.items.forEach(function (t) { g.appendChild(t.el); });
}
function openFolder(t) {
  folderOpen = t; folderAt = 0;
  $('ftitle').textContent = t.title;
  $('fgrid').textContent = '';
  t.items.forEach(function (a) { tile(a); });
  $('folder').className = 'on';
  drawFolder();
  modal();
}
function closeFolder() { folderOpen = null; $('folder').className = ''; modal(); }
function folderKey(k) {
  var n = folderOpen.items.length, f = folderAt;
  if (k === 461 || k === 8) { sound('back'); return closeFolder(); }
  if (k === 37 && f % 5 > 0) f--;
  else if (k === 39 && f + 1 < n && (f + 1) % 5 > 0) f++;
  else if (k === 38 && f >= 5) f -= 5;
  else if (k === 40 && f + 5 < n) f += 5;
  else if (k === 13) { var t = folderOpen.items[f]; closeFolder(); return open(t); }
  if (f !== folderAt) sound('move');
  folderAt = f;
  drawFolder();
}

/* ---- Plex: PIN link, then the chosen libraries become wallpaper sources ---- */
var plex = read('home-plex', { id: 'home-' + Date.now(), token: '', base: '', server: '', sections: [], video: '', photo: '' });
function plexSave() { write('home-plex', plex); }
function plexFetch(url, method, token) {
  var h = { Accept: 'application/json', 'X-Plex-Product': 'Home', 'X-Plex-Version': VERSION, 'X-Plex-Client-Identifier': plex.id, 'X-Plex-Platform': 'webOS', 'X-Plex-Device': 'LG TV', 'X-Plex-Device-Name': 'LG TV DC' };
  if (token) h['X-Plex-Token'] = token;
  return fetch(url, { method: method || 'GET', headers: h }).then(function (r) { return r.json(); });
}
var plexCode = '', plexPoll = 0;
function plexLink() {
  plexFetch('https://plex.tv/api/v2/pins', 'POST').then(function (p) {
    plexCode = p.code;
    if (stack.length) drawPage(true);
    clearInterval(plexPoll);
    plexPoll = setInterval(function () {
      plexFetch('https://plex.tv/api/v2/pins/' + p.id).then(function (j) {
        if (j.authToken) { clearInterval(plexPoll); plexCode = ''; plex.token = j.authToken; plexSave(); plexDiscover(); }
      }).catch(function () {});
    }, 3000);
  }).catch(function () { plexCode = 'unavailable, try again'; if (stack.length) drawPage(true); });
}
function plexDiscover() {
  plexFetch('https://plex.tv/api/v2/resources?includeHttps=1', 'GET', plex.token).then(function (list) {
    var s = list.filter(function (r) { return (r.provides || '').indexOf('server') >= 0; })[0];
    if (!s) return;
    var c = (s.connections || []).filter(function (x) { return x.local; })[0] || (s.connections || [])[0];
    plex.base = c.uri; plex.server = s.name; plex.key = s.accessToken || plex.token;
    plexSave();
    return plexFetch(plex.base + '/library/sections', 'GET', plex.key).then(function (j) {
      plex.sections = (j.MediaContainer.Directory || []).map(function (d) { return { key: d.key, title: d.title, type: d.type }; });
      plexSave();
      if (stack.length) drawPage(true);
    });
  }).catch(function () {});
}
function plexPull() {
  if (!plex.base) return;
  function parts(j) { return (j.MediaContainer.Metadata || []).map(function (m) { var p = m.Media && m.Media[0] && m.Media[0].Part && m.Media[0].Part[0]; return p ? { key: p.key, title: m.title } : null; }).filter(Boolean); }
  if (plex.video) plexFetch(plex.base + '/library/sections/' + plex.video + '/all?type=1', 'GET', plex.key).then(function (j) {
    plexVideos = parts(j).map(function (p) { return [plex.base + p.key + '?X-Plex-Token=' + plex.key, p.title, 'plex']; });
    write('home-plex-videos', plexVideos);
  }).catch(function () {});
  if (plex.photo) plexFetch(plex.base + '/library/sections/' + plex.photo + '/all?type=13', 'GET', plex.key).then(function (j) {
    plexPhotos = parts(j).slice(0, 200).map(function (p) { return plex.base + '/photo/:/transcode?width=1920&height=1080&minSize=1&upscale=0&url=' + encodeURIComponent(p.key) + '&X-Plex-Token=' + plex.key; });
    write('home-plex-photos', plexPhotos);
  }).catch(function () {});
}
function pagePlex() {
  return { title: 'Plex', sub: 'Use your Plex libraries as wallpaper and screensaver.', rows: function () {
    if (!plex.token) return [{ label: 'Link Plex Account', icon: 'PLAY_CIRCLE', ok: plexLink }].concat(plexCode ? [{ label: 'Go to plex.tv/link and enter: ' + plexCode, note: true }] : []);
    var vids = plex.sections.filter(function (s) { return s.type === 'movie' || s.type === 'show'; }), pics = plex.sections.filter(function (s) { return s.type === 'photo'; });
    function pick(label, list, key) {
      return choice(label, [['', 'None']].concat(list.map(function (s) { return [s.key, s.title]; })), function () { return plex[key]; }, function (v) { plex[key] = v; plexSave(); plexPull(); });
    }
    return [{ label: 'Server: ' + (plex.server || 'searching'), note: true }, pick('My Videos', vids, 'video'), pick('My Photos', pics, 'photo'),
      { label: 'Unlink Plex', icon: 'DELETE', ok: function () { plex.token = ''; plex.base = ''; plexSave(); } }];
  } };
}

/* ---- remote ---- */
document.addEventListener('keydown', function (e) {
  lastKey = Date.now();
  if (document.body.classList.contains('idle')) { saver(false); e.preventDefault(); return; }
  var k = e.keyCode, a = document.activeElement;
  if (a && a.id === 'field') {
    if (k === 13) { var q = a.value; a.blur(); var p = stack[stack.length - 1]; if (p && p.search && q) p.search(q); e.preventDefault(); }
    else if (k === 461) { a.blur(); e.preventDefault(); }
    return;
  }
  if (pinCb) { e.preventDefault(); return pinKey(k); }
  if (stack.length) { e.preventDefault(); return pageKey(k); }
  if (folderOpen) { e.preventDefault(); return folderKey(k); }
  if (zone === 'pill') {
    e.preventDefault();
    if (k === 40 || k === 461 || k === 8) { zone = 'grid'; sound('move'); paint(); }
    else if (k === 13) { zone = 'grid'; paint(); sound('select'); push(pageControl()); }
    return;
  }
  var f = focus;
  if (k === 37 && f % COLS > 0) f--;
  else if (k === 39 && f + 1 < tiles.length && (f + 1) % COLS > 0) f++;
  else if (k === 38 && f >= COLS) f -= COLS;
  else if (k === 38 && !moving) { zone = 'pill'; sound('move'); paint(); e.preventDefault(); return; }
  else if (k === 40) { if (f + COLS < tiles.length) f += COLS; else if (Math.floor(f / COLS) < Math.floor((tiles.length - 1) / COLS)) f = tiles.length - 1; }
  else if (k === 13) {
    e.preventDefault();
    if (moving) { if (!e.repeat) { held = 'drop'; setMoving(false); } }
    else if (!held) held = setTimeout(function () { held = 'hold'; var t = tiles[focus]; if (t && t.id !== 'com.palm.app.settings') push(tileMenu(t)); else if (t) setMoving(true); }, 650);
    return;
  }
  else if (k === 461 || k === 8) {
    e.preventDefault();
    if (moving) setMoving(false);
    else if (focus >= COLS) { focus %= COLS; sound('back'); paint(); }
    else if (S.backSaver) saver(true);
    return;
  }
  else return;
  e.preventDefault();
  if (f === focus) nudge(k === 37 ? -1 : k === 39 ? 1 : 0, k === 38 ? -1 : k === 40 ? 1 : 0);
  else if (moving) shift(f);
  else { focus = f; sound('move'); }
  paint();
});
document.addEventListener('keyup', function (e) {
  if (e.keyCode !== 13) return;
  if (typeof held === 'number') { clearTimeout(held); if (zone === 'grid' && tiles[focus] && !stack.length) open(tiles[focus]); }
  held = null;
});
document.addEventListener('webOSRelaunch', function () { saver(false); closeAll(); if (folderOpen) closeFolder(); lastKey = Date.now(); refresh(); if (!$('v0').src && !$('v1').src) next(); });

/* ---- start ---- */
$('glow').style.transform = 'scale(' + window.innerWidth / 96 + ')';
$('f0').style.transform = $('f1').style.transform = 'scale(' + window.innerWidth / 192 + ')';
theme();
clock(true);
loadWeather();
loadNews();
plexPull();
netPill();
refresh();
next();
setTimeout(function () { document.body.classList.remove('first'); }, 1400);
setInterval(function () {
  clock();
  if (S.appearance === 'auto') theme();
  if (S.saverMin && Date.now() - lastKey > S.saverMin * 60000 && !document.hidden && !stack.length) saver(true);
}, 5000);
setInterval(function () { loadWeather(); loadNews(); netPill(); theme(); }, 30 * 60 * 1000);
api('/api/frontend-ok', { version: VERSION }).catch(function () {});
