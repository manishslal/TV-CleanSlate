name: Device report
description: Share results from a TV or streaming box
labels: [device]
body:
  - type: input
    id: model
    attributes: {label: Model}
    validations: {required: true}
  - type: input
    id: os
    attributes: {label: OS and version}
    validations: {required: true}
  - type: textarea
    id: result
    attributes:
      label: What worked and what failed
      description: Remove IP addresses, MAC addresses, Wi-Fi names and serial numbers.
    validations: {required: true}
